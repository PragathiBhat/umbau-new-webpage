<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROBONEXUS</title>
    <!-- Warms the browser cache for the Explore page's intro scene while a
         visitor is still on the homepage, so the point-cloud file (the main
         source of visible load lag) is likely already cached by the time
         they click through. The ?v= must match DATA_URL in
         robonexus-opening/index.html exactly, or this prefetches a
         different cache entry than the one actually fetched later. -->
    <link rel="prefetch" href="/assets/robonexus-opening/site-points-forming.bin?v=3" as="fetch" />
    <link rel="prefetch" href="/assets/robonexus-opening/vendor/three.min.js" as="script" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
