<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" fill="none" stroke="#2EFF4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- chassis top face -->
  <rect x="40" y="24" width="260" height="96" rx="16" />
  <!-- chassis front skirt -->
  <path d="M40,104 L40,128 Q40,138 50,138 L290,138 Q300,138 300,128 L300,104" />
  <line x1="40" y1="104" x2="40" y2="104" />

  <!-- turntable -->
  <circle cx="170" cy="70" r="52" />
  <circle cx="170" cy="70" r="36" stroke-width="1.4" opacity="0.75" />
  <circle cx="170" cy="70" r="6" fill="#2EFF4D" stroke="none" />
  <line x1="170" y1="18" x2="170" y2="34" stroke-width="1.4" opacity="0.75" />
  <line x1="170" y1="106" x2="170" y2="122" stroke-width="1.4" opacity="0.75" />
  <line x1="118" y1="70" x2="134" y2="70" stroke-width="1.4" opacity="0.75" />
  <line x1="206" y1="70" x2="222" y2="70" stroke-width="1.4" opacity="0.75" />

  <!-- indicator lights -->
  <rect x="52" y="112" width="14" height="8" rx="2" />
  <rect x="76" y="112" width="14" height="8" rx="2" />
  <rect x="250" y="112" width="14" height="8" rx="2" />

  <!-- id plate -->
  <rect x="130" y="112" width="70" height="14" rx="2" stroke-width="1.4" opacity="0.75" />
  <line x1="138" y1="119" x2="192" y2="119" stroke-width="1" opacity="0.6" />

  <!-- wheels peeking from under the skirt -->
  <circle cx="76" cy="144" r="10" />
  <circle cx="264" cy="144" r="10" />
</svg>
